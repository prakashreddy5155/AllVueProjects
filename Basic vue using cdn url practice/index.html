<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 

        <a href="www.google.com" v-on:click.prevent="callFunction()">
            Go To Google
        </a>
        



        <div class="cont" v-on:click="calledMe()">

                hi

                <!-- here .stop on the v-on:click directive is used for stop it from propagating from click to its parent which is div's its parent v-on:click but it only executes its own button method which gets triggered. -->
                <button v-on:click.stop="triggerButtonMethod()">
                    click me to trigger button method
                </button>

        </div>


        <button v-on:click.once="triggerButtonMethod()">
                   I will be triggered only once. !
                </button>


        </div>
</body>

<script>
    const {createApp} = Vue;
    
    createApp({

        setup()
        {

            function callFunction()
            {
                console.log("Calling function");
            }

            function calledMe()
            {
                console.log("Called me !");
            }

            function triggerButtonMethod()
            {
                console.log("triggerd button method");
            }
            return {
                callFunction,
                calledMe,
                triggerButtonMethod
            };
        }
    }).mount("#app");
</script>
<style>
    .cont 
    {
        height:50px;
        width:300px;
        background-color: aqua;
        border:1px solid black;
    }
</style>
</html>
