<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 

        Enter something and press anykey to trigger the method: 
        <!-- This executes for every key click irrespective of any.-->
        <input type="text" v-on:keyup="executeClicked()">

    </br>
        
        Enter something and press enter to trigger the method
        <!-- this works only for the enter-->
        <input type="text" v-on:keyup.enter="executeEnterClicked()">

       
    </br>

    Enter something and press ctrl + enter to trigger the method
        <!-- this works only for the enter-->
        <input type="text" v-on:keyup.enter.ctrl="executeCtrlEnterClicked()">

        </div>
</body>

<script>
    const {createApp} = Vue;
    
    createApp({

        setup()
        {

            function executeClicked()
            {
                console.log("Clicked");
            }
            function executeEnterClicked()
            {
                console.log("Enter clicked");
            }
            function executeCtrlEnterClicked()
            {
                console.log("ctrl + Enter clicked");
            }
            return {
              executeClicked,
              executeEnterClicked,
              executeCtrlEnterClicked
            };
        }
    }).mount("#app");
</script>

</html>
