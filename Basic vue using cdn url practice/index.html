<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">
    
        <ul>
            <li v-for="(value,key,index) in companyDetails" :key="value.id">
           {{index}} --- {{key}} ::: {{value}}

            <input type="text">
            </li>
        </ul>
        
        <div>
            {{shuffleCompanyDetails()}}
        </div>
    </div>


</body>

<script>

    const {createApp,reactive} = Vue;
    
    createApp({

        setup()
        {

            let companyDetails = reactive([
               { id: 1,company: "Accenture solutions pvt ltd"},
                {id: 2,isForeign: true},
                {id: 3,isWealthy: true},
                {id: 4,limit:100000},
                {id: 5,isCorporateCardEnabled:false},
                {id: 6,salary:100000}
            ]);
            
            function shuffleCompanyDetails()
            {
                setTimeout(()=> 
                {
                companyDetails.sort(()=> Math.random() - 0.5);
                },5000);
            }

            return {
                companyDetails,
                shuffleCompanyDetails
            };
        }
    }).mount("#app");
</script>
</html>
