<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 

        <!-- Typical html way of writing the style-->
        <div style="background-color: aqua; color:white">
            HelloWorld !
        </div>

        <!-- Vue.js way of writing style.-->
        <div v-bind:style="{backgroundColor: 'aqua',color:'white'}">
            HelloWorld !
        </div>

        <!-- vue.js way of writing style but with keeping the properties of css same as it should be instead of making them camelCase-->
        <div v-bind:style="{'background-color': 'aqua','color':'white'}">
            HelloWorld !
        </div>


        <!-- Doing with the javascript object but with keeping css styling not with camelCase-->
         <div v-bind:style="standardColorWithCamelCase">
            HelloWorld !
        </div>

        <div v-bind:style="standardColorWithOutCamelCase">
            HelloWorld !
        </div>
    </div>



</body>

<script>

    const {createApp} = Vue;
    
    createApp({

        setup()
        {
            const standardColorWithCamelCase = {backgroundColor:'aqua',color:'white'}

            const standardColorWithOutCamelCase = {'background-color':'aqua','color':'white'}
            return {
                standardColorWithCamelCase,
                standardColorWithOutCamelCase
            };
        }
    }).mount("#app");
</script>
</html>
