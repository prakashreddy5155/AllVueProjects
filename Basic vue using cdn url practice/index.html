<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 
        
        <div>
            {{counter}}
        </div>

        {{getFullName}}

        <div>
        <button v-on:click="counter++">
            increment
        </button>
        <button v-on:click="counter--">
            decrement
        </button>
        </div>

        Enter First Name: 
        <input type="text" v-model="firstName">
    </div>
</body>

<script>
    const {createApp,ref,computed} = Vue;
    
    createApp({

        setup()
        {
            let counter = ref(0);
            let firstName = ref("Om Sai");
            let lastName = ref("N");


             const getFullName = computed((prev) => {
                    if(prev === 'Om Sai Prakash N')
                    {
                        console.log("matched ... ");
                        console.log("Doing operation");
                    }
                    console.log("getFullName called");
                    return firstName.value + " "+ lastName.value;
                });

            return {
                counter,
                getFullName,
                firstName,
            };
        }
    }).mount("#app");
</script>

</html>
