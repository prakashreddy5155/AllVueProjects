<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 
        
        <div>
            {{counter}}
        </div>

        {{getFullName()}}

        <div>
        <button v-on:click="counter++">
            increment
        </button>
        <button v-on:click="counter--">
            decrement
        </button>
        </div>

    </div>
</body>

<script>
    const {createApp,ref} = Vue;
    
    createApp({

        setup()
        {
            let counter = ref(0);
            let firstName = "om sai ";
            let lastName = "N";


            function getFullName() {
                    console.log("getFullName called");
                    return firstName + " "+ lastName;
                };

            return {
                counter,
                getFullName,
            };
        }
    }).mount("#app");
</script>

</html>
