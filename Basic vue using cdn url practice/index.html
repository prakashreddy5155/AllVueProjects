<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app">

        {{returnMessage()}}
        {{returnData()}}
        <label for="i1">
            <input type="number" id="i1" class="val1">
        </label>
        <label for="i2">
            <input type="number" id="i2" class="val2">
        </label>
        

        <div class="result">
            {{result}}
        </div>
        <div>
            Lucky Number is: {{luckyNumber}} 
        </br>
            employee is: {{employee}}
        </br>
        company is :{{companyDetails}}
        </div>
        {{updateLuckyNumber()}}
    </div>


</body>

<script>

    const {createApp,ref,reactive} = Vue;
    
    createApp({
        
        setup()
        {
            const message = "hi vue !";
            let result = 10;
            let luckyNumber = ref(6);
            let employee = ref({
                name: 'sai',
                age: 23,
                height:5.85
            })
            let companyDetails = reactive({
                company: "Accenture solutions pvt ltd",
                isForeign: true,
                isWealthy: true
            })

            function returnData()
            {
                return "I am doing good !, But need to focus more !";
            }
            function returnMessage()
            {
                return message.toUpperCase();
            }
            
            function updateLuckyNumber()
            {
                setTimeout(()=>{
                    luckyNumber.value = Math.ceil((Math.random()*10));
                    employee.value.age = 24;
                    employee.value.name= "Om Sai Prakash"
                    companyDetails.company="JusPay";
                    console.log(luckyNumber.value);

                },2000);
                
            }
            
            return {
                returnMessage,
                result,
                returnData,
                updateLuckyNumber,
                luckyNumber,
                employee,
                companyDetails
            };
        }
    }).mount("#app");
</script>
</html>
