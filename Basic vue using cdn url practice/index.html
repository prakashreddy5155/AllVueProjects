<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 


        <div>

            <span class="standardColorOfBlackAndFontSize10px" v-bind:class="{backgroundBlueAndMargin10px:true,colorOfWhiteAndFontSize20px:false}">
                I am inevitable
            </span>
        </div>


    </div>



</body>

<script>

    const {createApp} = Vue;
    
    createApp({

        setup()
        {
            const fontSizeTemp = 60;
            const standardColorWithCamelCase = {backgroundColor:'aqua',color:'white'}

            const standardColorWithOutCamelCase = {'background-color':'aqua','color':'white'}
            return {
                fontSizeTemp
            };
        }
    }).mount("#app");
</script>
<style>

    .standardColorOfBlackAndFontSize10px
    {
        color:black;
        font-size:10px;
    }
    .backgroundBlueAndMargin10px 
    {
        background-color: blue;
        padding:10px
    }
    .colorOfWhiteAndFontSize20px 
    {
        color:white;
        font-size:20px;
    }
</style>
</html>
