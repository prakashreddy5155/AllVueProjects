<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 


        <!-- vue.js way of writing style but with keeping the properties of css same as it should be instead of making them camelCase-->
        <div v-bind:style="{'background-color': 'aqua','color':'white','font-size':fontSizeTemp + 'px'}">
            HelloWorld !
        </div>

    </div>



</body>

<script>

    const {createApp} = Vue;
    
    createApp({

        setup()
        {
            const fontSizeTemp = 60;
            const standardColorWithCamelCase = {backgroundColor:'aqua',color:'white'}

            const standardColorWithOutCamelCase = {'background-color':'aqua','color':'white'}
            return {
                fontSizeTemp
            };
        }
    }).mount("#app");
</script>
</html>
