<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 
        
        <button v-on:click="triggerMe()">Click me to trigger the triggerMe Method</button>

        <button v-on:click="triggerAnotherByPassingArugments('Sai',true)">
            click me to trigger a method which send arugments
        </button>
    </div>
</body>

<script>

    const {createApp} = Vue;
    
    createApp({

        setup()
        {
            function triggerMe()
            {
                console.log("I am triggered");
            }

            function triggerAnotherByPassingArugments(param1,param2)
            {   
                    console.log(param1);
                    console.log(param2);
            }
            return {
             triggerMe,
             triggerAnotherByPassingArugments
            };
        }
    }).mount("#app");
</script>

</html>
