<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN vue.js practice</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <div id="app"> 


        <!-- Model modifiers-->
        Enter the name: 
        <input type="text" v-model.trim="name" >
        </br>
        </br>
        Enter the age:
        <input type="number" v-model.lazy.number="age">  <!-- adding like this is perfectly valid in javascript , we can chain mutliple things like lazy, number, trim and many more and that works well.-->
        </br>
        <span>
            {{name}} is {{age}} years old
        </span>

    </div>
</body>

<script>
    const {createApp,ref} = Vue;
    
    createApp({

        setup()
        {
            let name = ref("");
            let age = ref();
            return {
                name,
                age
            };
        }
    }).mount("#app");
</script>

</html>
