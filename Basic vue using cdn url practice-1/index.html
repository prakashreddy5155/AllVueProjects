<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">

        
        <div class="input">
          <!-- normal v-model -->
          <input  v-model="name"  type="text">

          <input  v-model.trim="nameUsingTrim" type="text">


          <input v-model.number="age" type="text">


          <input v-model.lazy="name" type="text">
                    
        </div>

        <div class="display"> 
         normal: {{name}} </br>
          normal: {{name.length}} </br>
          with trim: {{nameUsingTrim}} </br>
          with trim: {{nameUsingTrim.length}} <br>
          with number: {{ typeof age}}
        </div>



      
      </div>
    </div>
</body>
<script>
    const {createApp,ref,reactive} = Vue

    createApp({
        setup()
        {
          let name = ref('');
          let nameUsingTrim = ref('')
          let age = ref('')

              return {
                name,
                age,
                nameUsingTrim
              }
          }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  .buttons button
  {
    height:30px;
    width:30px;
    margin:5px;
  }
  .display 
  {
    height:fit-content;
    width:120px;
    border:1px solid red;
  }
</style>
</html>
