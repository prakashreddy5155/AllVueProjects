<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">
        <!-- array v-for -->
        <!-- for index based in arrays there wouldn't be anything, key is nothing but index in arrays but for objects its different -->
        <div>
          <p v-for="(value,key,index) in myArr">
            {{index}} - arr[{{key}}]: {{value}}
          </p>
        </div>
        <!-- object v-for -->
        <div>
          <p v-for="(value,key,index) in employee">
            {{index}} - property - {{key}} :  {{value}}
          </p>
        </div>
        
      </div>
    </div>
</body>
<script>
    const {createApp,ref} = Vue

    createApp({
        setup()
        {
            const myArr = [5,6,7,10,16];
            const employee = {
              name: "Om Sai Prakash",
              age: 23,
              company: "Accenture",
              careerLevel:12
            };
            return {
              myArr,
              employee
            }
        }
    }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  .buttons button
  {
    height:30px;
    width:30px;
    margin:5px;
  }
  
</style>
</html>
