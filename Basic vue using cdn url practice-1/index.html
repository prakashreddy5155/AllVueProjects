<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">


          <div>
            <p v-if="callAnotherMethod()">
              one div
            </p>
            <p v-else-if="callAnotherVElseIf()">
              else if
            </p>
            <p v-else="callAnotherVElse()">
              else  
            </p>
          </div>

           <div :style="applyDynamicStyle()">
            Hey I am dynamically styled.
          </div> 

          <div v-html="getData()">

          </div>

        <div>
          Counter Application
          {{counter}} </br>
          <button v-on:click="counter--">-</button> <br>
          <button v-on:click="counter++">+</button>
        </div>

      </div>
    </div>
</body>
<script>
    const {createApp,ref,reactive} = Vue

    createApp({
        setup()
        {
          let counter = ref(0);
          function callMethod()
          {
            console.log("another method called");
          }
          
          function callAnotherMethod()
          {
            console.log("V-If");
            return false;
          }
          function callAnotherVElseIf()
          {
            console.log("V-Else-if");
            return false;
          }
          function callAnotherVElse()
          {
            console.log("V-Else");
            return false;
          }

          function applyDynamicStyle()
          {
            console.log("Called Dynamic style method");
            return {
              color:'red',
              backgroundColor:'yellow'
              }
          }

          function getData()
          {
            console.log("getData method invoked");
            return "<i> Hi This is italics </i>";
          }

              return {
                counter,
                callMethod,
                callAnotherMethod,
                callAnotherVElseIf,
                callAnotherVElse,
                applyDynamicStyle,
                getData
              }
          }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  

</style>
</html>
