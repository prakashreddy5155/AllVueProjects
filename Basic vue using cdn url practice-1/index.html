<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">

        
        <div>
          <!-- link -->
           prevent: <a v-on:click.prevent="executeFunction()" href="https://www.google.com">Google</a>
            </br>
          once:  <a v-on:click.once="executeFunction()" href="https://www.google.com" target="_blank">Google</a>
            </br>

            <div v-on:click="triggeredParent()">
          stop:  <a v-on:click.stop="executeFunction()" href="https://www.google.com" target="_blank">Google</a>
          </div>
          <!-- button -->

          </br>
          <div v-on:click="triggeredParent()"> 
          <button v-on:click="increaseCount()">+</button>

          </div>
          output: {{count}}
        </div>



      
      </div>
    </div>
</body>
<script>
    const {createApp,ref,reactive} = Vue

    createApp({
        setup()
        {
          let count = ref(0);
          function executeFunction()
          {
            console.log("Hey Hi, Executing function ");
          }
          function increaseCount()
          {
            console.log("clicked");
            this.count++;
          }
          function triggeredParent()
          {
            console.log("Parent triggered");
          }
              return {
                count,
                executeFunction,
                increaseCount,
                triggeredParent
              }
          }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  .buttons button
  {
    height:30px;
    width:30px;
    margin:5px;
  }
</style>
</html>
