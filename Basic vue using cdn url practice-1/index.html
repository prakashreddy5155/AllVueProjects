<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">

        
        <div>
          <!-- if i click o it the default behaviour is to go to google.com, but if i want to remvoe that default behaviour and want to check some conditions before navigating to google.com then i need to use  his, here, i have provided the function execute functiona and later after doing that I can use window.location.href to change the url dynamically so that is will open it.-->
          <a  v-on:click.prevent="executeFunction()" href="https://www.google.com">Google</a>
        </div>

      
      </div>
    </div>
</body>
<script>
    const {createApp,ref,reactive} = Vue

    createApp({
        setup()
        {
          function executeFunction()
          {
            console.log("Hey Hi, Executing function ");

            setTimeout(()=> 
              {
                window.location.href="https://www.google.com";
              },2000)
          }
              return {
                executeFunction
              }
          }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  .buttons button
  {
    height:30px;
    width:30px;
    margin:5px;
  }
</style>
</html>
