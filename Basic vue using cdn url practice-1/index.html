<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">


        any button click down can trigger: <input type="text" v-on:keydown="invokeMethod()">
        <br>
        enter key down can trigger: <input type="text" v-on:keydown.enter="invokeMethod()">
        <br>
        ctrl + Enter triggers: <input type="text" v-on:keydown.ctrl.enter="invokeMethod()">

      </div>
    </div>
</body>
<script>
    const {createApp,ref,reactive} = Vue

    createApp({
        setup()
        {

            function invokeMethod()
            {
              console.log("method invoked");
            }
              return {
                invokeMethod
              }
          }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }

</style>
</html>
