<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Movie Project</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
<div id="app">
    <div class="parent"> 

      <form v-on:submit.prevent="handleForm()">
        <div class="container">
          <div class="heading">
            <h1>FormOpedia</h1>
          </div>

          <div>
            <ul>
              <li :style="{color:'red',listStyleType:'none'}" v-for="error in errorList">{{error}}</li>
            </ul>
          </div>
          <div class="inputDiv">
            <span  class="textSpan" > Name  </span>
           <input name="name" type="text" v-model.trim="formObj.name" class="inputBox" placeholder="Enter Name" >
          </div>

          <div class="inputDiv">
            <span class="textSpan"> Email  </span>
           <input  name= "email" type="text" v-model.trim="formObj.email" class="inputBox" placeholder="Enter Email">
          </div>
   
          <div class="inputDiv">
            <span  class="textSpan">Phone   </span>
          <input  name="phone" type="number" v-model.number="formObj.phone" class="inputBox" placeholder="Enter Phone Number">
          </div>
          <!-- <div class="inputDiv">
            <p  class="" >Gender </p>
            <span>Male</span>
            <input  type="radio" v-model="formObj.gender" name="gender" value="male">
            <span>Female</span>
            <input type="radio" v-model="formObj.gender" name="gender" value="female">
          </div> -->
          
          <div class="inputDiv">
            <p >Gender </p>
            <select name="gender"  class="inputBox" v-model="formObj.genderUsingDropDown">
              <option selected value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div>
            
            <input type="checkbox" v-model="formObj.isSubscribed">
            <span>Subscribe to the news Letter</span>
          </div>

          <div class="inputDiv">
            <button>Submit</button>
          </div>
        </div>
      </form>

    </div>
</div>
</body>
<script>
    const {createApp,ref,reactive,computed,watch} = Vue

    createApp({
        setup()
        {
            const formObj = reactive({
              email: '',
              name: '',
              phone:'',
              genderUsingDropDown:'male',
              isSubscribed:false,
            })

            const errorList = reactive([]);

            function handleForm()
            {
              const regex =  /[a-z0-9A-Z]+@[a-zA-z]+[.][a-zA-Z]/;
              errorList.length = 0;
              if(formObj.name.length < 3)
              {
                errorList.push('Name should be atleast 3 characters in length');
              }
              if(!regex.test(formObj.email))
              {
                errorList.push("please provide a valid email id");
              }
              if(formObj.isSubscribed === false )
              {
                errorList.push("please subscribe to news letter before submitting form")
              }

              if(!errorList.length)
              {
                alert("Form is submitted");
                 console.log(formObj);
              }
             
            }

            return {
              formObj,
              handleForm,
              errorList
            }
        }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  .parent 
  {

    display: flex;
    justify-content: center;
  }
  
  .container 
  {
    text-align: center;
    height:500px;
    width:800px;
    background-color: rgb(70, 70, 144);

  }
  .inputDiv 
  {
    margin:10px;
  }
  .textSpan
  {
    width:100px;
  }

  .inputDiv button 
  {
    width:100px;
    height:40px;
    border-radius: 6px;
    cursor:pointer;
  }

  .inputBox 
  {
    width:200px;
    height:30px;
    border-radius: 10px;
  }

</style>
</html>
