<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js practice using cdn 29th november 2025</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
      <div class="parent">
        

        <div v-bind:class="returnDynamicCss()">
          Hi
        </div>

        <div v-bind:class="[returnDynamicCss().margin10pxBorderStyle ? '':'margin10pxBorderStyle']">
          Yellow background and black text 
        </div>
      
        
        <div :class="[{margin10pxBorderStyle: true,backgroundYellowColorWhite: true}]">
          huup
        </div>
      </div>
    </div>
</body>
<script>
    const {createApp,ref,reactive} = Vue

    createApp({
        setup()
        {
          
          function returnDynamicCss()
          {
            return {
              margin10pxBorderStyle :true
            }
          }
          function returnBackgroundColorYellowWhite()
          {
            return {
              backgroundYellowColorWhite : true
            }
          }
              return {
                returnDynamicCss,
                returnBackgroundColorYellowWhite
              }
          }
      }).mount("#app");
</script>
<style>
  #app 
  {
    display: flex;
    justify-content: center;
  }
  .buttons button
  {
    height:30px;
    width:30px;
    margin:5px;
  }
  .margin10pxBorderStyle 
  {
    height:50px;
    width:50px;
    margin:2px;
    border:2px solid black;
    
  }
  .backgroundYellowColorWhite
  {
    background-color: yellow;
    color: white;
  }
</style>
</html>
